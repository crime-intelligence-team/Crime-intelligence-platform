# Staging/demo deployment. Differences from docker-compose.yml (dev):
#   - no source bind-mounts (runs the image as built, not live-reloaded code)
#   - api runs without --reload, with multiple workers
#   - postgres/neo4j ports are NOT published to the host — only the api
#     container talks to them, over the compose network
#   - a Caddy reverse proxy terminates TLS and serves the built frontend
#
# Secrets (POSTGRES_PASSWORD, NEO4J_PASSWORD) come from a root-level .env
# file (docker compose auto-loads it for variable interpolation below) —
# copy .env.prod.example to .env and fill in real values first. See
# docs/deployment.md.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: cip-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: cip-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - attachment_storage:/app/data/attachments
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    container_name: cip-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  neo4j_data:
  attachment_storage:
  caddy_data:
  caddy_config:
